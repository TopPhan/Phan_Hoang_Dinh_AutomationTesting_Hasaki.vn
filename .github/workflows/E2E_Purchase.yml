name: Hasaki.vn Automation Regression

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  E2E_Purchase_Flow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Edge
        run: |
          sudo apt-get update
          sudo apt-get install -y microsoft-edge-stable

      # Gộp tất cả lệnh thay thế vào 1 dòng dùng nhiều flag -e
      - name: Inject Secrets to XML
        run: |
          sed -i -e "s/\${CHROME_USER}/${{ secrets.CHROME_USER }}/g" \
                 -e "s/\${CHROME_PASS}/${{ secrets.CHROME_PASS }}/g" \
                 -e "s/\${EDGE_USER}/${{ secrets.EDGE_USER }}/g" \
                 -e "s/\${EDGE_PASS}/${{ secrets.EDGE_PASS }}/g" \
                 src/test/java/resources/**/*.xml

      - name: Run Maven Tests (Headless)
        run: |
          mvn clean test \
          -DsuiteXmlFile=src/test/java/resources/master/Master_E2E_Purchase.xml \
          -Dheadless=true
        continue-on-error: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-artifacts
          path: |
            target/surefire-reports/
            ScreenShots/
            allure-results/